# Streamlit-native theme tokens. Component CSS lives only in ui/theme.py (one theme unit).
# Dark navy / steel-blue / teal palette matching the approved workflow reference.
[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#050C1C"
secondaryBackgroundColor = "#0C1830"
textColor = "#E8EEF8"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# Serves ./static (the LS logo) at /app/static/ so the header can reference it by a relative URL.
enableStaticServing = true
